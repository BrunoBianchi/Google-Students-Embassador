# Place this file in /etc/nginx/conf.d/campus.studentembassador.com.conf
#
# Nginx is the only public process. Bun services must use HOST=127.0.0.1
# and are therefore reachable only from this Droplet.

limit_req_zone $binary_remote_addr zone=gsa_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=gsa_auth:10m rate=5r/s;

upstream gsa_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream gsa_backend {
    server 127.0.0.1:3001;
    keepalive 32;
}

# HTTP is used only for the ACME challenge and for permanent HTTPS redirects.
server {
    listen 206.81.1.32:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://campus.studentembassador.com$request_uri;
    }
}

# This server receives the apex, legacy google subdomain, and every wildcard subdomain,
# then permanently sends them (308) to the public canonical URL: campus.studentembassador.com.
server {
    listen 206.81.1.32:443 ssl http2 default_server;
    server_name studentembassador.com *.studentembassador.com google.studentembassador.com;

    ssl_certificate /etc/letsencrypt/live/studentembassador.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studentembassador.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/studentembassador.com/chain.pem;
    include /etc/nginx/snippets/gsa-tls.conf;

    return 308 https://campus.studentembassador.com$request_uri;
}

server {
    listen 206.81.1.32:443 ssl http2;
    server_name campus.studentembassador.com;

    ssl_certificate /etc/letsencrypt/live/studentembassador.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studentembassador.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/studentembassador.com/chain.pem;
    include /etc/nginx/snippets/gsa-tls.conf;

    server_tokens off;
    client_max_body_size 4m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; connect-src 'self' https://nominatim.openstreetmap.org https://maps.googleapis.com https://maps.gstatic.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://maps.googleapis.com https://maps.gstatic.com;" always;

    location = /api/2026/google/user/login {
        limit_req zone=gsa_auth burst=10 nodelay;
        include /etc/nginx/snippets/gsa-proxy.conf;
        proxy_pass http://gsa_backend;
    }

    location = /api/2026/google/user/register {
        limit_req zone=gsa_auth burst=5 nodelay;
        include /etc/nginx/snippets/gsa-proxy.conf;
        proxy_pass http://gsa_backend;
    }

    # API and uploads are only reachable through this same public host.
    location ^~ /api/ {
        limit_req zone=gsa_api burst=40 nodelay;
        include /etc/nginx/snippets/gsa-proxy.conf;
        proxy_pass http://gsa_backend;
    }

    location ^~ /uploads/ {
        include /etc/nginx/snippets/gsa-proxy.conf;
        proxy_pass http://gsa_backend;
    }

    location / {
        include /etc/nginx/snippets/gsa-proxy.conf;
        proxy_pass http://gsa_frontend;
    }
}
